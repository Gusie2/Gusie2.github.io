<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="preload" href="https://fonts.googleapis.com/css?family=Open+Sans:400,700&display=swap" as="style" type="text/css" crossorigin>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#FFA500">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href='/css/style.css'>
    <title>{{ page.title }}</title>
  </head>
  <body>
    
    <header class="page-header">
      <div class="site-name" style="font-size:x-large; color:white">Guus Ros</div>
      <div style="display:flex; justify-content: flex-end; margin-top:0.5rem">
        <a href="/" class="btn"> Home </a>
        <a href="/projects.html" class="btn">Projects</a>
        <div class="dropdown" style="margin-left:0.5rem;">
          <button onclick="dropDownFunction()" class="dropbtn">Blog Posts</button>
          <div id="myDropdown" class="dropdown-content">
            {% for post in site.posts %}
              <a href="{{ post.url }}">{{ post.title }}</a>
            {% endfor %}
          </div>
        </div>
      </div>
    </header>

    <main id="content" class="main-content" role="main">
      {{ content }}

      <footer class="site-footer">
        {% if site.github.is_project_page %}
          <span class="site-footer-owner"><a href="{{ site.github.repository_url }}">{{ site.github.repository_name }}</a> is maintained by <a href="{{ site.github.owner_url }}">{{ site.github.owner_name }}</a>.</span>
        {% endif %}
        <span class="site-footer-credits">This page was generated by <a href="https://pages.github.com">GitHub Pages</a>.</span>
      </footer>
    </main>
    <script>
    /* When the user clicks on the button, 
    toggle between hiding and showing the dropdown content */
    function dropDownFunction() {
      document.getElementById("myDropdown").classList.toggle("show");
    }

    // Close the dropdown if the user clicks outside of it
    window.onclick = function(event) {
      if (!event.target.matches('.dropbtn')) {
        var dropdowns = document.getElementsByClassName("dropdown-content");
        var i;
        for (i = 0; i < dropdowns.length; i++) {
          var openDropdown = dropdowns[i];
          if (openDropdown.classList.contains('show')) {
            openDropdown.classList.remove('show');
          }
        }
      }
    }
    </script>
  </body>
</html>
